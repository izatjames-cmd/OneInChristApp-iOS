<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sunday School local UI check</title>
  <link rel="stylesheet" href="/src/style.css">
  <style>
    body { margin: 0; padding: 16px; background: #eee; font-family: Arial, sans-serif; }
    #checks { max-width: 560px; margin: 0 auto 16px; }
    #phone { width: 360px; max-width: 100%; box-sizing: border-box; margin: auto; padding: 18px; background: #fffdf8; }
  </style>
</head>
<body>
  <section id="checks"><h2>Local UI check</h2><p id="result">Checking...</p><button id="gallery">Gallery</button> <button id="teachers">Teachers</button></section>
  <main id="phone" class="sunday-school-module"></main>
  <script type="module">
    import { renderSundaySchoolGallery } from '/src/ministry/sunday-school/sundaySchoolGallery.js'
    import { renderSundaySchoolMembers } from '/src/ministry/sunday-school/sundaySchoolMembers.js'
    const phone = document.getElementById('phone')
    let cleanup
    const checks = []
    async function mount(renderer, staff = true) {
      await cleanup?.()
      phone.replaceChildren()
      const container = document.createElement('div')
      phone.appendChild(container)
      cleanup = await renderer({ container, user: { uid: 'teacher' }, member: { name: 'Test Teacher' }, adminAccess: staff ? { sundaySchoolTeacher: true } : {}, onRefresh: async () => {} })
      await new Promise(resolve => setTimeout(resolve, 100))
      return container
    }
    function check(condition, description) {
      if (!condition) throw new Error(description)
      checks.push(description)
    }
    try {
      await mount(renderSundaySchoolGallery)
      check(phone.querySelector('form'), 'Teacher can add gallery media')
      check(phone.querySelector('video[controls]'), 'Gallery renders video playback')
      check(phone.querySelector('img'), 'Existing gallery photos still render')
      await mount(renderSundaySchoolGallery, false)
      check(!phone.querySelector('form'), 'Ordinary member cannot upload gallery media')
      await mount(renderSundaySchoolMembers, false)
      check(!phone.querySelector('form'), 'Ordinary member cannot send staff messages')
      check(!window.__chatSubscriptions, 'Ordinary member does not subscribe to staff chat')
      await mount(renderSundaySchoolMembers)
      check(phone.querySelector('form'), 'Teacher can send staff messages')
      check(phone.textContent.includes('The lesson is ready for Sunday.'), 'Staff sees shared conversation')
      check(Array.from(phone.querySelectorAll('button')).some(button => /record/i.test(button.textContent)), 'Voice recording control is visible')
      check(phone.scrollWidth <= phone.clientWidth, 'Teacher page fits the mobile width')
      await mount(renderSundaySchoolGallery)
      check(phone.scrollWidth <= phone.clientWidth, 'Gallery fits the mobile width')
      document.getElementById('result').textContent = checks.length + ' checks passed: ' + checks.join('; ') + '.'
    } catch (error) {
      document.getElementById('result').textContent = 'FAILED: ' + error.message
      console.error(error)
    }
    document.getElementById('gallery').onclick = () => mount(renderSundaySchoolGallery)
    document.getElementById('teachers').onclick = () => mount(renderSundaySchoolMembers)
  </script>
</body>
</html>
